<title>Türkiye Dioramaları</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Figtree:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-bleed WebGL stage, a scene card top-left, a scene rail + controls bottom. Single dark look by design. */
:root{
  --ink:#f7f0e6; --ink-dim:rgba(247,240,230,.66); --glass:rgba(18,14,26,.46); --glass-hi:rgba(255,255,255,.12);
  --line:rgba(255,255,255,.16); --al:#e30a17; --gold:#f2c46d;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#140f1c;color:var(--ink);font-family:var(--body)}
#sky{position:fixed;inset:0;background:linear-gradient(#9fd0f0,#f5e3ea)}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
#scrim{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 70% at 0% 0%,rgba(12,9,20,.5),transparent 45%),linear-gradient(0deg,rgba(12,9,20,.28),transparent 20%)}
#flash{position:fixed;inset:0;background:#dfe8ff;opacity:0;pointer-events:none}
#fade{position:fixed;inset:0;background:#0d0a12;opacity:1;pointer-events:none;transition:opacity .75s ease}
.card{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));
  max-width:min(440px,calc(100vw - 32px));pointer-events:none;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.card .eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);display:flex;gap:10px;align-items:center}
.card .eyebrow i{display:inline-block;width:18px;height:12px;border-radius:2px;background:var(--al);position:relative;flex:none}
.card .eyebrow i::after{content:"";position:absolute;left:4px;top:2px;width:7px;height:7px;border-radius:50%;box-shadow:-1.5px 0 0 1.5px #fff;transform:translateX(1px)}
.card h1{font:400 clamp(34px,6vw,58px)/1 var(--display);margin:.18em 0 .12em;text-wrap:balance;letter-spacing:-.01em}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--ink);opacity:.9;max-width:36ch}
.card .meta{margin-top:10px;font:500 11.5px/1.5 var(--mono);color:var(--ink-dim);letter-spacing:.04em}
.card > *{transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
.card.out > *{opacity:0;transform:translateY(8px)}
.card.out p{transition-delay:0s}
.card:not(.out) p{transition-delay:.12s}.card:not(.out) .meta{transition-delay:.22s}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;pointer-events:none}
.rail,.ctrl{pointer-events:auto;display:flex;gap:4px;padding:5px;border-radius:14px;background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line)}
.rail{flex-wrap:wrap;min-width:0}
.rail button,.ctrl button{appearance:none;border:0;background:transparent;color:var(--ink-dim);font:600 13px/1 var(--body);padding:10px 12px 12px;border-radius:10px;cursor:pointer;position:relative;white-space:nowrap}
.rail button:hover,.ctrl button:hover{color:var(--ink);background:var(--glass-hi)}
.rail button:focus-visible,.ctrl button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.rail button[aria-current="true"]{color:var(--ink);background:rgba(255,255,255,.14)}
.rail button .n{font:500 10px var(--mono);opacity:.6;margin-right:6px}
.rail button .bar{position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden;opacity:0}
.rail button[aria-current="true"] .bar{opacity:1}
.rail button .bar b{display:block;height:100%;width:0;background:var(--gold)}
.ctrl button{display:flex;align-items:center;gap:7px}
.ctrl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctrl button[aria-pressed="true"]{color:var(--ink);background:rgba(255,255,255,.14)}
.hint{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));font:500 11px/1.5 var(--mono);color:var(--ink-dim);
  background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:8px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .4s}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:#140f1c;z-index:10;transition:opacity .6s}
#loader div{text-align:center}
#loader h2{font:400 34px var(--display);margin:0 0 8px}
#loader span{font:500 12px var(--mono);color:var(--ink-dim);letter-spacing:.08em}
@media (max-width:640px){
  .rail button{padding:9px 9px 11px;font-size:12px}.rail button .n{display:none}
  .ctrl .lbl{display:none}.hint{display:none}
  .card p{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){.card > *{transition:none}#fade{transition:none}}
</style>

<div id="sky"></div>
<canvas id="stage" tabindex="0" aria-label="Üç boyutlu Türkiye dioraması"></canvas>
<div id="scrim"></div>
<div id="flash"></div>
<div id="fade"></div>

<header class="card out" id="card" aria-live="polite">
  <div class="eyebrow"><i aria-hidden="true"></i><span id="c-eye">01 / 05</span></div>
  <h1 id="c-title">Kadıköy İskelesi</h1>
  <p id="c-sub"></p>
  <div class="meta" id="c-meta"></div>
</header>
<div class="hint" id="hint">Sürükle: döndür · Tekerlek: yakınlaş · ← → sahne</div>

<nav class="dock">
  <div class="rail" id="rail" aria-label="Sahneler"></div>
  <div class="ctrl">
    <button id="b-play" aria-pressed="false" title="Duraklat (boşluk)"><svg viewBox="0 0 24 24" id="i-play"><path d="M8 5v14M16 5v14"/></svg><span class="lbl" id="l-play">Duraklat</span></button>
    <button id="b-cam" aria-pressed="false" title="Serbest kamera (C)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12a9 4 0 0 0 18 0a9 4 0 0 0-18 0"/></svg><span class="lbl" id="l-cam">Serbest kamera</span></button>
    <button id="b-full" title="Tam ekran (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</nav>
<div id="loader"><div><h2>Türkiye Dioramaları</h2><span id="load-msg">Sahneler kuruluyor…</span></div></div>
